name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Install Android SDK Platform 37.0
        run: sdkmanager --install "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v5
      - run: bash ./gradlew :app:assembleRelease :app:testDebugUnitTest :app:lintRelease --no-configuration-cache
